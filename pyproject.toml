[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localbench"
version = "0.1.0"
description = "Offline-first, privacy-first local LLM benchmarking and model-selection platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "LocalBench Contributors" }
]
keywords = ["llm", "benchmark", "local", "ollama", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "typer>=0.9,<1.0",
    "rich>=13.0,<14.0",
    "psutil>=5.9,<6.0",
    "PyMuPDF>=1.23,<2.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7,<4.0",
    "httpx>=0.24,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "pytest-cov>=4.0,<5.0",
    "ruff>=0.1.0",
]

[project.scripts]
localbench = "localbench.cli:app"

[project.urls]
Homepage = "https://github.com/localbench/localbench"
Repository = "https://github.com/localbench/localbench"
Issues = "https://github.com/localbench/localbench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/localbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.coverage.run]
source = ["localbench"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
]